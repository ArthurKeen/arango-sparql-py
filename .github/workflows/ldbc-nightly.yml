name: LDBC nightly

# LDBC SNB Interactive v1 at SF0.1 (PRD §13.6, LDBC-8). The per-PR CI
# runs only the translation ratchet (`tests/ldbc/test_ldbc_ratchet.py`,
# no data); this job runs the data tier:
#
#   * fetch the SHA-256-pinned Turtle and parameters (never vendored).
#     The archives are cached by their pins, so LDBC's server is asked
#     once, not nightly. LDBC's server refused this runner with HTTP 403
#     (2026-10-28), so the first fetch needs the repository variable
#     LDBC_DATASET_MIRROR: a base URL serving the archives at LDBC's paths.
#     A mirror's file must still match the pin (tests/ldbc/datasets.py);
#   * warm the pyoxigraph oracle (answers and timeouts are cached across
#     runs: some shapes take minutes, and a query whose text has not
#     changed never needs recomputing);
#   * load RPT, LPG and PG and check counts and mappings against the
#     model, then check every translating cell's live outcome against the
#     committed ledger (`test_ldbc_execution.py`);
#   * run the performance runner and publish its JSON and the generated
#     report as artifacts. Timings are report-only (§9.4).
#
# These are not LDBC Benchmark Results.

on:
  schedule:
    # 05:47 UTC daily, after the W3C nightly (05:17).
    - cron: "47 5 * * *"
  workflow_dispatch:

jobs:
  ldbc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_ROOT_PASSWORD: openSesame
          # Size ArangoDB's caches to a share of the runner, as
          # docker-compose.ldbc.yml does locally (the harness also caps
          # every query's memory).
          ARANGODB_OVERRIDE_DETECTED_TOTAL_MEMORY: 6G
        ports:
          - 28533:8529
        options: >-
          --health-cmd "wget -qO- --header='Content-Type: application/json' --post-data '{\"username\":\"root\",\"password\":\"openSesame\"}' http://127.0.0.1:8529/_open/auth >/dev/null 2>&1"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 40
    env:
      LDBC_ARANGO_URL: http://localhost:28533
      LDBC_ARANGO_USER: root
      LDBC_ARANGO_PASSWORD: openSesame
      LDBC_SF: "0.1"
      LDBC_ORACLE_TIMEOUT: "600"
      RUN_INTEGRATION: "1"
      RUN_LDBC: "1"
      # Empty when the variable is unset; the fetch then asks LDBC only.
      LDBC_DATASET_MIRROR: ${{ vars.LDBC_DATASET_MIRROR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Each cache is restored before the step that fills it and saved
      # right after that step. actions/cache saves only when the whole job
      # succeeds, and the LDBC tier is meant to fail on a regression, which
      # would otherwise throw away a download or hours of oracle answers.
      #
      # The pinned archives, keyed by the file holding the pins. Older
      # entries restore too: fetch() checks each archive against its pin and
      # re-downloads only a mismatch, so an edit to that file that leaves the
      # pins alone does not send the job back to LDBC's server.
      - id: archives
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/arango-sparql/ldbc/archives
          key: ldbc-archives-${{ hashFiles('tests/ldbc/datasets.py') }}
          restore-keys: ldbc-archives-
      - run: bash scripts/fetch_ldbc.sh
      - if: steps.archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/arango-sparql/ldbc/archives
          key: ${{ steps.archives.outputs.cache-primary-key }}
      # The oracle's answers: each run saves a new entry and restores the
      # latest. Entries are keyed by query text and data digest, so a stale
      # one is never read. Saved even when warming fails part-way, so the
      # answers it did compute are kept.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/arango-sparql/ldbc/sf0.1-normalized/oracle-cache
          key: ldbc-oracle-sf0.1-${{ github.run_id }}
          restore-keys: ldbc-oracle-sf0.1-
      - id: warm
        run: python -m tests.ldbc.oracle --warm --sf 0.1 --jobs 4 --timeout 600
      - if: always() && steps.warm.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/arango-sparql/ldbc/sf0.1-normalized/oracle-cache
          key: ldbc-oracle-sf0.1-${{ github.run_id }}
      # Loads the three layouts on first use, then: counts, mappings,
      # domains, and each cell's live outcome against the ledger.
      - run: pytest tests/ldbc -m ldbc -q --tb=short
      - run: python -m tests.ldbc.bench --sf 0.1 --out ldbc-results.json
      - run: python -m tests.ldbc.report ldbc-results.json --out ldbc-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldbc-sf0.1
          path: |
            ldbc-results.json
            ldbc-report.md
          if-no-files-found: ignore
