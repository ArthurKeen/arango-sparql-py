name: CI

# Mirrors the structure of arango-cypher-py's CI so a contributor fluent
# in one repo gets the same signals in the other. Two diffs vs. that
# template are intentional:
#
# * the integration job is omitted in v0 because the live ArangoDB
#   harness (tests/w3c/test_w3c_live_execution.py and friends) is gated
#   behind RUN_INTEGRATION=1 and not yet on the release-blocking path;
# * the packaging job is omitted because we don't ship a sdist build
#   smoke test yet (will land alongside the first PyPI release).
#
# When either of those gates becomes a hard release requirement, copy
# the corresponding job verbatim from references/arango-cypher-py/.github
# /workflows/ci.yml — that's the source of truth for the matching shape.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      # `ruff format --check .` enforces the same canonical style the
      # repo was bootstrapped with. To unbreak a future PR that trips
      # this, run `ruff format .` locally and recommit.
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Floor matches `requires-python = ">=3.11"` in pyproject.toml.
        # Re-add 3.10 only if the requires-python floor moves down too.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,nl,service]"
      # Excludes:
      #   * integration   — needs Docker + live ArangoDB
      #   * w3c           — heavy translation-only harness; runs nightly,
      #                     not per-PR (separate workflow lands later)
      #   * eval          — NL eval harness; gated on RUN_EVAL=1
      - run: pytest -m "not integration and not w3c and not eval" --tb=short -q
