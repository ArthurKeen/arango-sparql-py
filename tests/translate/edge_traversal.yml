# Golden corpus for object-property (edge-collection) traversal.
#
# Covers PRD §6.1's two edge-relationship styles:
#
#   * DEDICATED_COLLECTION (PG-typed edge): one edge collection per
#     relationship type → ``FOR v, e IN OUTBOUND <s> @@edgeColl``.
#   * GENERIC_WITH_TYPE (LPG-typed edge): shared edge collection with
#     a discriminator field → the same traversal plus
#     ``FILTER e.<typeField> == @<typeValue>``.
#
# Both shapes are exercised in BGP and OPTIONAL contexts so the same
# emitter is verified through visit_BGP and visit_LeftJoin.
#
# Cross-product pruning: when the SPARQL object variable is already
# bound by a prior BGP triple (e.g. ``?b a :Person . ?a :knows ?b``),
# the visitor emits ``FILTER v._uri == <prior_alias>._uri`` so the
# engine joins on the URI instead of returning the cross-product.

ontology: |
  @prefix : <http://ex.org/> .
  @prefix owl: <http://www.w3.org/2002/07/owl#> .
  @prefix phys: <https://arango.solutions/phys#> .

  :Person a owl:Class ; phys:collectionName "Person" .
  :Company a owl:Class ; phys:collectionName "Company" .

  # DEDICATED_COLLECTION: one edge collection per relationship type.
  :knows a owl:ObjectProperty ;
      phys:edgeCollectionName "knows" .

  # GENERIC_WITH_TYPE: shared "rel" collection discriminated by ``type``.
  # Two relationship types ride the same physical collection so the
  # visitor MUST emit the discriminator FILTER to keep them apart.
  :worksAt a owl:ObjectProperty ;
      phys:edgeCollectionName "rel" ;
      phys:typeField "type" ;
      phys:typeValue "worksAt" .
  :livesIn a owl:ObjectProperty ;
      phys:edgeCollectionName "rel" ;
      phys:typeField "type" ;
      phys:typeValue "livesIn" .

cases:
  # --------------------------------------------------------------- BGP
  - name: dedicated_edge_one_traversal
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?a ?b WHERE {
        ?a a :Person .
        ?a :knows ?b .
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FOR v2, e3 IN OUTBOUND doc1 @@c2_knows
      RETURN { a: NOT_NULL(doc1._uri, doc1._id), b: NOT_NULL(v2._uri, v2._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_knows": "knows"

  - name: typed_edge_one_traversal
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?a ?b WHERE {
        ?a a :Person .
        ?a :worksAt ?b .
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FOR v2, e3 IN OUTBOUND doc1 @@c2_rel
      FILTER e3.type == @_p1_type
      RETURN { a: NOT_NULL(doc1._uri, doc1._id), b: NOT_NULL(v2._uri, v2._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_rel": "rel"
      "_p1_type": "worksAt"

  - name: edge_then_object_typed_pattern
    # ``?a :knows ?b . ?b a :Person`` — ?b is scanned once (its type
    # pattern, then its name), and ``knows`` is walked INBOUND from it
    # rather than scanning Person a second time for ?a and joining
    # (``_join_rank`` rank 2). ``?a a :Person`` is then a collection
    # test on the walked vertex (``knows`` declares no domain to place it).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?a ?b ?n WHERE {
        ?a a :Person .
        ?a :knows ?b .
        ?b a :Person .
        ?b :name ?n .
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FOR v2, e3 IN INBOUND doc1 @@c2_knows
      FILTER IS_SAME_COLLECTION(@_p1_coll, v2)
      RETURN { a: NOT_NULL(v2._uri, v2._id), b: NOT_NULL(doc1._uri, doc1._id), n: doc1.name }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_knows": "knows"
      "_p1_coll": "Person"

  - name: uri_subject_edge
    # ``<:alice> :knows ?b`` — URI subjects open a default-collection
    # FOR with an _uri equality filter, then the traversal starts from
    # that alias.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?b WHERE { :alice :knows ?b . }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER (doc1._uri == @_p1_uri || (doc1._uri == null && doc1._id == @_p1_uri))
      FOR v2, e3 IN OUTBOUND doc1 @@c2_knows
      RETURN { b: NOT_NULL(v2._uri, v2._id) }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_uri": "http://ex.org/alice"
      "@c2_knows": "knows"

  - name: uri_object_edge
    # ``?a :knows :alice`` — IRI object becomes an equality FILTER on
    # the traversal vertex's _uri.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?a WHERE {
        ?a a :Person .
        ?a :knows :alice .
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FOR v2, e3 IN OUTBOUND doc1 @@c2_knows
      FILTER (v2._uri == @_p1_uri || (v2._uri == null && v2._id == @_p1_uri))
      RETURN { a: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_knows": "knows"
      "_p1_uri": "http://ex.org/alice"

  - name: typed_edge_same_collection_two_relationships
    # Two relationship types over the SHARED ``rel`` collection: each
    # triple gets its own discriminator FILTER so the result set
    # doesn't bleed worksAt edges into the livesIn slot. rdflib's
    # algebra translation reorders BGP triples alphabetically by
    # predicate IRI (here: ``livesIn`` before ``worksAt``), and the
    # visitor preserves that order so the emission is deterministic
    # across rdflib releases.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?a ?c ?p WHERE {
        ?a a :Person .
        ?a :worksAt ?c .
        ?a :livesIn ?p .
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FOR v2, e3 IN OUTBOUND doc1 @@c2_rel
      FILTER e3.type == @_p1_type
      FOR v4, e5 IN OUTBOUND doc1 @@c2_rel
      FILTER e5.type == @_p2_type
      RETURN { a: NOT_NULL(doc1._uri, doc1._id), c: NOT_NULL(v4._uri, v4._id), p: NOT_NULL(v2._uri, v2._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_rel": "rel"
      "_p1_type": "livesIn"
      "_p2_type": "worksAt"

  # ----------------------------------------------------------- OPTIONAL
  - name: optional_dedicated_edge
    # OPTIONAL { ?s :knows ?b } is a padded left join: the matching
    # edges become rows of a subquery, and the outer FOR iterates them —
    # one solution per edge, or one with ?b unbound when there is none
    # (SPARQL 1.1 §18.5). It used to take the first edge only
    # (``LIMIT 1 … [0]``), losing a row per extra edge (issue #48).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?b WHERE {
        ?s a :Person .
        OPTIONAL { ?s :knows ?b }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      LET optsub4 = (
        FOR v2, e3 IN OUTBOUND doc1 @@c2_knows
        RETURN {f0: NOT_NULL(v2._uri, v2._id)}
      )
      FOR optrow5 IN (LENGTH(optsub4) > 0 ? optsub4 : [null])
      RETURN { s: NOT_NULL(doc1._uri, doc1._id), b: optrow5.f0 }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_knows": "knows"

  - name: optional_typed_edge
    # GENERIC_WITH_TYPE in an OPTIONAL: the discriminator FILTER lands
    # *inside* the subquery, so only typed edges become rows.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?c WHERE {
        ?s a :Person .
        OPTIONAL { ?s :worksAt ?c }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      LET optsub4 = (
        FOR v2, e3 IN OUTBOUND doc1 @@c2_rel
        FILTER e3.type == @_p1_type
        RETURN {f0: NOT_NULL(v2._uri, v2._id)}
      )
      FOR optrow5 IN (LENGTH(optsub4) > 0 ? optsub4 : [null])
      RETURN { s: NOT_NULL(doc1._uri, doc1._id), c: optrow5.f0 }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_rel": "rel"
      "_p1_type": "worksAt"

  - name: optional_edge_alongside_attribute
    # Mixed-binding OPTIONAL with one attribute lookup AND one edge: the
    # whole block is one subquery, so it matches as a unit — an edge
    # counts only when the attribute is there too — and with no match
    # both variables are unbound in the single padded row.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?email ?b WHERE {
        ?s a :Person .
        OPTIONAL { ?s :email ?email ; :knows ?b }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      LET optsub4 = (
        FOR v2, e3 IN OUTBOUND doc1 @@c2_knows
        FILTER doc1.email != null
        RETURN {f0: NOT_NULL(v2._uri, v2._id), f1: doc1.email}
      )
      FOR optrow5 IN (LENGTH(optsub4) > 0 ? optsub4 : [null])
      RETURN { s: NOT_NULL(doc1._uri, doc1._id), email: optrow5.f1, b: optrow5.f0 }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_knows": "knows"

  - name: optional_edge_inner_filter_reads_inner_and_outer_vars
    # An inner FILTER is part of the block: it runs inside the subquery,
    # reading the block's ``?e`` (``doc1.email``) and the required side's
    # ``?n``. Its bind variables are minted in the subquery's builder and
    # merged when it is absorbed (issue #48).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?b WHERE {
        ?s a :Person ; :name ?n .
        OPTIONAL { ?s :knows ?b ; :email ?e FILTER(CONTAINS(?e, "@ex.org") && ?n != "Bob") }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      LET optsub4 = (
        FOR v2, e3 IN OUTBOUND doc1 @@c2_knows
        FILTER doc1.email != null
        FILTER (CONTAINS(doc1.email, @_p1) && (doc1.name != @_p2))
        RETURN {f0: NOT_NULL(v2._uri, v2._id), f1: doc1.email}
      )
      FOR optrow5 IN (LENGTH(optsub4) > 0 ? optsub4 : [null])
      RETURN { s: NOT_NULL(doc1._uri, doc1._id), b: optrow5.f0 }
    expected_bind_vars:
      "@c1_Person": "Person"
      "@c2_knows": "knows"
      "_p1": "@ex.org"
      "_p2": "Bob"
