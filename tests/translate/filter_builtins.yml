# Golden corpus for the SPARQL 1.1 FILTER / projection builtins
# added in the v0.7 slice:
#
# * ``Builtin_IF(cond, then, else)``     — SPARQL §17.4.1.5
# * ``Builtin_CONCAT(a, b, c, …)``       — SPARQL §17.4.2.4
# * ``Builtin_LANG(literal)``            — SPARQL §17.4.2.3
# * ``Builtin_LANGMATCHES(tag, range)``  — SPARQL §17.4.2.3 / RFC 4647
#
# Plus the empty-BGP path that empty ``WHERE { }`` /
# ``BIND``-only queries trigger: ``visit_BGP`` opens a degenerate
# ``FOR <empty_alias> IN [1]`` so Extend / Filter / Project have
# somewhere to attach.
#
# ``LANG`` always emits the AQL literal ``""`` — in our PG / LPG
# storage model literals are bare primitives with no carrier for
# language metadata, so ``LANG(?v) = ""`` is the spec-conformant
# result for the literals our storage can produce. ``LANGMATCHES``
# then folds through the empty-string case and always evaluates
# false at runtime — the AQL is still correct (a future
# lang-tag-aware storage will get correct semantics for free).

ontology: ""

cases:
  # ---- Builtin_IF ----------------------------------------------------

  - name: if_basic_ternary
    # ``IF(?n > 0, "pos", "neg")`` evaluates its condition once in a
    # one-row subquery. The explicit null branch preserves SPARQL errors;
    # AQL's bare ternary would incorrectly treat null as false.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s (IF(?n > 0, "pos", "neg") AS ?sign) WHERE { ?s :n ?n }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "n")
      LET bv3 = (FOR ifc2 IN [(doc1.n > @_p1)] RETURN ifc2 == null ? null : (ifc2 ? (@_p2) : (@_p3)))[0]
      RETURN { s: doc1._uri, sign: bv3 }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1": 0
      "_p2": "pos"
      "_p3": "neg"

  - name: if_inside_filter
    # ``FILTER (IF(?n > 0, true, false))`` — the error-preserving
    # one-row expression is itself the FILTER condition.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :n ?n . FILTER (IF(?n > 0, true, false)) }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "n")
      FILTER (FOR ifc2 IN [(doc1.n > @_p1)] RETURN ifc2 == null ? null : (ifc2 ? (@_p2) : (@_p3)))[0]
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1": 0
      "_p2": true
      "_p3": false

  # ---- Builtin_CONCAT ------------------------------------------------

  - name: concat_three_args
    # Variadic CONCAT — rdflib stores the args as a Python list on
    # ``.arg`` (NOT ``.arg1`` / ``.arg2`` like binary builtins).
    # AQL's CONCAT is variadic too, so the mapping is a direct
    # comma-join of translated operands.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (CONCAT(?a, "-", ?b) AS ?c) WHERE { ?s :a ?a ; :b ?b }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "a")
      FILTER HAS(doc1, "b")
      LET bv2 = CONCAT(doc1.a, @_p1, doc1.b)
      RETURN { c: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1": "-"

  # ---- Builtin_LANG / LANGMATCHES ------------------------------------

  - name: langmatches_specific_tag
    # ``LANGMATCHES(LANG(?n), "en")`` — LANG always emits ``""`` in
    # our storage model (no lang tag carrier). The LANGMATCHES
    # expansion implements RFC 4647: ``range == "*"`` matches any
    # non-empty tag; otherwise case-insensitive equality OR prefix
    # match on ``tag-...``. With ``""`` in the tag slot the whole
    # filter always evaluates false at runtime, which is the
    # spec-conformant answer for tag-less literals.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :n ?n . FILTER LANGMATCHES(LANG(?n), "en") }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "n")
      FILTER ("" != '' && (@_p1 == '*' || LOWER("") == LOWER(@_p1) || STARTS_WITH(LOWER(""), CONCAT(LOWER(@_p1), '-'))))
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1": "en"

  - name: langmatches_wildcard
    # ``LANGMATCHES(LANG(?n), "*")`` — the "any non-empty tag"
    # form. Still evaluates false in our storage model because the
    # ``LANG()`` slot is ``""``, but the AQL must encode the
    # wildcard branch (``range == '*'``) faithfully.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :n ?n . FILTER LANGMATCHES(LANG(?n), "*") }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "n")
      FILTER ("" != '' && (@_p1 == '*' || LOWER("") == LOWER(@_p1) || STARTS_WITH(LOWER(""), CONCAT(LOWER(@_p1), '-'))))
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1": "*"

  # ---- Builtin_SUBSTR ------------------------------------------------

  - name: substr_three_arg
    # ``SUBSTR(?n, 1, 3)`` — SPARQL §17.4.3.3 with all three args.
    # SPARQL ``start`` is 1-based; AQL ``SUBSTRING`` is 0-based, so
    # the emitter subtracts 1 in-line at execution time (works for
    # both literal and variable ``start`` values). The ``FILTER HAS
    # (doc1, "name")`` guard is contributed by the variable-object
    # BGP emitter (predicate-existence FILTER slice).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :name ?n FILTER (SUBSTR(?n, 1, 3) = "abc") }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      FILTER (SUBSTRING(doc1.name, (@_p1) - 1, @_p2) == @_p3)
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1": 1
      "_p2": 3
      "_p3": "abc"

  - name: substr_two_arg
    # ``SUBSTR(?n, 2)`` — optional-length form (substring to end of
    # the source string). The emitter MUST detect the missing
    # ``length`` slot via ``"length" in expr.keys()`` because rdflib's
    # ``CompValue.get`` returns the key name string when an attribute
    # is absent — a ``.get(...) is None`` check would crash here.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :name ?n FILTER (SUBSTR(?n, 2) = "bc") }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      FILTER (SUBSTRING(doc1.name, (@_p1) - 1) == @_p2)
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1": 2
      "_p2": "bc"

  - name: substr_variable_start
    # ``SUBSTR(?n, ?off)`` — variable starting offset routed
    # through the same ``(start) - 1`` shift, exercising the case
    # where the offset is an attribute reference (``doc1.off``)
    # rather than a bind variable. Both ``?n`` and ``?off`` triples
    # carry the predicate-existence guard.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (SUBSTR(?n, ?off) AS ?suffix) WHERE { ?s :name ?n ; :off ?off }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      FILTER HAS(doc1, "off")
      LET bv2 = SUBSTRING(doc1.name, (doc1.off) - 1)
      RETURN { suffix: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"

  # ---- Builtin_URI / Builtin_IRI -------------------------------------

  - name: uri_constructor_from_string
    # ``URI(str)`` / ``IRI(str)`` — SPARQL §17.4.2.8. Constant string
    # arguments are BASE-resolved at translate time (no BASE here, so
    # an absolute lexical form binds unchanged). Relative+BASE is
    # covered by ``uri_constructor_resolves_against_base``.
    sparql: |
      SELECT (URI("http://ex.org/x") AS ?u) WHERE {}
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv2 = @_p1_iri
      RETURN { u: bv2 }
    expected_bind_vars:
      "_p1_iri": "http://ex.org/x"

  - name: uri_constructor_resolves_against_base
    # W3C ``functions/iri01`` — relative ``URI("uri")`` / ``IRI("iri")``
    # against ``BASE <http://example.org/>`` must produce absolute IRIs.
    sparql: |
      BASE <http://example.org/>
      SELECT (URI("uri") AS ?uri) (IRI("iri") AS ?iri) WHERE {}
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv2 = @_p1_iri
      LET bv3 = @_p2_iri
      RETURN { uri: bv2, iri: bv3 }
    expected_bind_vars:
      "_p1_iri": "http://example.org/uri"
      "_p2_iri": "http://example.org/iri"

  # ---- Builtin_RAND / UUID / STRUUID / BNODE -------------------------

  - name: rand_constant_projection
    # ``RAND()`` — SPARQL §17.4.1.7 returns xsd:double in [0, 1).
    # AQL ``RAND()`` is the same contract.
    sparql: |
      SELECT (RAND() AS ?r) WHERE {}
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv2 = RAND()
      RETURN { r: bv2 }
    expected_bind_vars: {}

  - name: uuid_returns_urn_iri
    # ``UUID()`` — SPARQL spec requires the IRI form
    # (``urn:uuid:…``). AQL ``UUID()`` returns the bare lexical
    # form, so we prepend the URN scheme.
    sparql: |
      SELECT (UUID() AS ?u) WHERE {}
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv2 = CONCAT('urn:uuid:', UUID())
      RETURN { u: bv2 }
    expected_bind_vars: {}

  - name: struuid_returns_lexical_string
    # ``STRUUID()`` — SPARQL spec returns the lexical UUID
    # without the ``urn:uuid:`` prefix.
    sparql: |
      SELECT (STRUUID() AS ?u) WHERE {}
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv2 = UUID()
      RETURN { u: bv2 }
    expected_bind_vars: {}

  - name: bnode_no_arg_fresh_per_row
    # ``BNODE()`` mints a fresh blank node per call. AQL's
    # ``UUID()`` re-evaluates per row (per the AQL non-deterministic
    # function contract), so wrapping it with the ``_:b`` blank-node
    # sigil gives the right semantics.
    sparql: |
      SELECT (BNODE() AS ?b) WHERE {}
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv2 = CONCAT('_:b', UUID())
      RETURN { b: bv2 }
    expected_bind_vars: {}

  - name: bnode_with_arg_deterministic
    # ``BNODE(arg)`` — same blank node for the same arg within the
    # query result. ``MD5(TO_STRING(arg))`` makes the identifier
    # deterministic and opaque, with collision probability low
    # enough to be irrelevant for SPARQL semantics (the spec only
    # requires per-row stability, not cross-row uniqueness).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s (BNODE(?n) AS ?b) WHERE { ?s :name ?n }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      LET bv2 = CONCAT('_:b', MD5(TO_STRING(doc1.name)))
      RETURN { s: doc1._uri, b: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"

  # ---- Builtin_TZ (SPARQL §17.4.5.11) -------------------------------

  - name: tz_extracts_timezone_string
    # ``TZ(?d)`` — returns the timezone portion of an xsd:dateTime
    # as a simple literal: ``"Z"``, ``"+HH:MM"``, ``"-HH:MM"``, or
    # ``""`` when no timezone is present. Pure substring extraction
    # — no AQL ``DATE_*`` parsing, because our storage model carries
    # the dateTime as a bare string whose lexical form is the original
    # xsd:dateTime text. The two anchored REGEX_TEST probes pick the
    # ``Z`` vs ``[+-]HH:MM`` vs ``""`` branches; ``SUBSTRING(..., -6)``
    # extracts the trailing six characters when the explicit-offset
    # branch fires.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s (TZ(?d) AS ?x) WHERE { ?s :date ?d }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "date")
      LET bv2 = (REGEX_TEST(TO_STRING(doc1.date), "Z$") ? "Z" : (REGEX_TEST(TO_STRING(doc1.date), "[+-][0-9]{2}:[0-9]{2}$") ? SUBSTRING(TO_STRING(doc1.date), LENGTH(TO_STRING(doc1.date)) - 6) : ""))
      RETURN { s: doc1._uri, x: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"

  - name: timezone_returns_daytime_duration
    # ``TIMEZONE(?d)`` — SPARQL §17.4.5.10. Unlike ``TZ`` (which
    # returns the raw lexical offset string), TIMEZONE returns an
    # xsd:dayTimeDuration: ``Z`` / ``±00:00`` → ``PT0S``; ``-08:00``
    # → ``-PT8H``; ``+05:30`` → ``PT5H30M`` (positive durations carry
    # no sign; zero components are elided). The CRUCIAL difference is
    # the no-timezone branch: TZ yields ``""`` but TIMEZONE *errors*,
    # which we model as AQL ``null`` so the projected column is
    # unbound (W3C ``functions/timezone-01`` row ``d4`` has no binding).
    # Same flattened-storage substring math as TZ — no DATE_* calls.
    # Regression for W3C ``functions/timezone-01``.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s (TIMEZONE(?d) AS ?x) WHERE { ?s :date ?d }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "date")
      LET bv2 = (REGEX_TEST(TO_STRING(doc1.date), "Z$") ? "PT0S" : (REGEX_TEST(TO_STRING(doc1.date), "[+-][0-9]{2}:[0-9]{2}$") ? ((TO_NUMBER(SUBSTRING(SUBSTRING(TO_STRING(doc1.date), LENGTH(TO_STRING(doc1.date)) - 6), 1, 2)) == 0 && TO_NUMBER(SUBSTRING(SUBSTRING(TO_STRING(doc1.date), LENGTH(TO_STRING(doc1.date)) - 6), 4, 2)) == 0) ? "PT0S" : CONCAT((SUBSTRING(SUBSTRING(TO_STRING(doc1.date), LENGTH(TO_STRING(doc1.date)) - 6), 0, 1) == "-" ? "-" : ""), "PT", (TO_NUMBER(SUBSTRING(SUBSTRING(TO_STRING(doc1.date), LENGTH(TO_STRING(doc1.date)) - 6), 1, 2)) > 0 ? CONCAT(TO_STRING(TO_NUMBER(SUBSTRING(SUBSTRING(TO_STRING(doc1.date), LENGTH(TO_STRING(doc1.date)) - 6), 1, 2))), "H") : ""), (TO_NUMBER(SUBSTRING(SUBSTRING(TO_STRING(doc1.date), LENGTH(TO_STRING(doc1.date)) - 6), 4, 2)) > 0 ? CONCAT(TO_STRING(TO_NUMBER(SUBSTRING(SUBSTRING(TO_STRING(doc1.date), LENGTH(TO_STRING(doc1.date)) - 6), 4, 2))), "M") : ""))) : null))
      RETURN { s: doc1._uri, x: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"

  # ---- Builtin_SHA256 (SPARQL §17.4.4.4) ----------------------------

  - name: sha256_native_aql_function
    # ``SHA256(?l)`` — ArangoDB AQL ships ``SHA256()`` as a built-in
    # string function (see arango.ai docs, "String functions in AQL").
    # An earlier slice rejected this builtin under the now-stale
    # assumption that AQL only exposed MD5 / SHA1 / SHA512; this
    # golden pins the corrected emission so a future "remove SHA256"
    # refactor breaks loudly.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (SHA256(?l) AS ?h) WHERE { ?s :str ?l }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "str")
      LET bv2 = SHA256(doc1.str)
      RETURN { h: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"

  # ---- Builtin_isLITERAL alias (SPARQL §17.4.2.1) -------------------

  - name: isliteral_uppercase_alias
    # ``ISLITERAL(?u)`` — rdflib's algebra translator spells the
    # uppercase source ``ISLITERAL`` as ``Builtin_isLITERAL`` (note
    # the case distinction) while ``isLiteral`` spells as
    # ``Builtin_isLiteral``. Both algebra-node names route to the
    # same emission — the same primitive-type probe the original
    # mixed-case builtin uses. Pinning the uppercase variant here
    # so a future dispatch-table reorganisation doesn't regress
    # the alias.
    sparql: |
      SELECT (STRLEN(?u) AS ?n) WHERE {
        BIND(STRUUID() AS ?u)
        FILTER (ISLITERAL(?u))
      }
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv2 = UUID()
      FILTER (IS_STRING(bv2) || IS_NUMBER(bv2) || IS_BOOL(bv2))
      LET bv3 = LENGTH(bv2)
      RETURN { n: bv3 }
    expected_bind_vars: {}

  # ---- Empty-BGP path ------------------------------------------------

  - name: empty_bgp_bind_only
    # ``BIND(<constant-expr> AS ?x)`` with no surrounding triples
    # — SPARQL §18.5 says the empty BGP produces a single empty
    # solution mapping (join's identity). AQL has no native empty
    # iteration; we open ``FOR empty1 IN [1]`` so the Extend's LET
    # and the projection's RETURN have somewhere to attach. The
    # empty-alias value is never referenced.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?x WHERE { BIND(LANGMATCHES('en', 'en') AS ?x) }
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv2 = (@_p1 != '' && (@_p2 == '*' || LOWER(@_p1) == LOWER(@_p2) || STARTS_WITH(LOWER(@_p1), CONCAT(LOWER(@_p2), '-'))))
      RETURN { x: bv2 }
    expected_bind_vars:
      "_p1": "en"
      "_p2": "en"

  - name: empty_where_constant_projection
    # ``SELECT (1+2 AS ?x) WHERE { }`` — projection-only query
    # over an empty pattern. The numeric guard preserves SPARQL type
    # errors instead of applying AQL's permissive coercion.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (1+2 AS ?x) WHERE { }
    expected_aql: |-
      FOR empty1 IN [1]
      LET bv4 = (FOR num2 IN [@_p1] FOR num3 IN [@_p2] RETURN IS_NUMBER(num2) && IS_NUMBER(num3) ? (num2 + num3) : null)[0]
      RETURN { x: bv4 }
    expected_bind_vars:
      "_p1": 1
      "_p2": 2

  # ---- XSD constructor casts (rdflib ``Function`` node, §17.5) -------
  #
  # IRI-named function calls like ``xsd:double(?v)`` parse to a
  # ``Function`` algebra node (NOT a ``Builtin_*``), dispatched via
  # ``filter_builtins.translate_function``. The casts map to AQL's
  # type-coercion builtins. ``xsd:integer`` (and its bounded-integer
  # siblings) truncate toward zero — NOT floor — so negatives round
  # the right way (``xsd:integer(-3.7)`` is ``-3``, not ``-4``); the
  # ternary picks FLOOR for non-negatives and CEIL for negatives.

  - name: xsd_cast_double_to_number
    sparql: |
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
      PREFIX : <http://ex.org/>
      SELECT (xsd:double(?v) AS ?d) WHERE { ?s :v ?v }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "v")
      LET bv2 = TO_NUMBER(doc1.v)
      RETURN { d: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"

  - name: xsd_cast_integer_truncates_toward_zero
    sparql: |
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
      PREFIX : <http://ex.org/>
      SELECT (xsd:integer(?v) AS ?i) WHERE { ?s :v ?v }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "v")
      LET bv2 = (TO_NUMBER(doc1.v) >= 0 ? FLOOR(TO_NUMBER(doc1.v)) : CEIL(TO_NUMBER(doc1.v)))
      RETURN { i: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"

  - name: xsd_cast_string_to_string
    sparql: |
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
      PREFIX : <http://ex.org/>
      SELECT (xsd:string(?v) AS ?st) WHERE { ?s :v ?v }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "v")
      LET bv2 = TO_STRING(doc1.v)
      RETURN { st: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"

  - name: xsd_cast_boolean_to_bool
    sparql: |
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
      PREFIX : <http://ex.org/>
      SELECT (xsd:boolean(?v) AS ?b) WHERE { ?s :v ?v }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "v")
      LET bv2 = TO_BOOL(doc1.v)
      RETURN { b: bv2 }
    expected_bind_vars:
      "@c1_Document": "Document"
