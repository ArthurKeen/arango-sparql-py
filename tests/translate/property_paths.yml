# Golden corpus for SPARQL 1.1 property paths (§9 / §18.4).
#
# The visitor's main triple dispatcher recognises ``rdflib.paths.Path``
# instances in the predicate slot (Case 0 in ``_emit_triple``) and
# delegates to ``arango_sparql.translate.paths.emit_path_triple``,
# which recursively desugars the path until the leaves are URIRef
# predicates that the existing PG / LPG / default-collection cases
# can handle.
#
# This slice covers SequencePath (``:p/:q/...``) and InvPath
# (``^path``) — both pure desugarings. AlternativePath, MulPath, and
# NegatedPath raise ``UnsupportedSparqlError`` with stable messages
# (covered by their own goldens below). Property-paths on RPT-mapped
# subjects are explicitly rejected with a typed error because the
# intermediate variables would need to inherit the RPT class binding;
# that wiring is deferred to a follow-up slice.
#
# Unlike most translation goldens this corpus drives an empty
# resolver (``SchemaResolver.from_turtle("", default_collection="Document")``)
# for the sequence/inverse cases. That matches the W3C analyzer's
# convention and exercises the default-collection fallback path —
# the configuration that the largest XFAIL buckets in the coverage
# report sit on. A single typed-class case is included to confirm
# that path expansion composes correctly with a type pattern.

ontology: ""

cases:
  # ---- SequencePath -------------------------------------------------

  - name: sequence_two_steps_default_collection
    # The smallest possible sequence: ``?s :p/:q ?o`` rewrites to
    # ``?s :p ?_path_1 . ?_path_1 :q ?o``. The intermediate variable
    # is materialised as a fresh FOR over the default collection,
    # with the join FILTER ``doc2._uri == doc1.p`` enforcing the
    # semantic link the SPARQL spec requires (without it the AQL
    # would emit the Cartesian product). This shape pre-dates the
    # path implementation in the sense that ``_ensure_subject_alias``
    # now lifts a Variable's prior ``var_to_expr`` binding into a
    # join FILTER on the new FOR — the same defence as the
    # object-side Variable case in ``_emit_triple`` Case 2.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s :p/:q ?o }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      FOR doc2 IN @@c1_Document
      FILTER doc2._uri == doc1.p
      FILTER HAS(doc2, "q")
      RETURN { s: doc1._uri, o: doc2.q }
    expected_bind_vars:
      "@c1_Document": "Document"

  - name: sequence_three_steps_chained_joins
    # Three steps → two intermediate variables → two join FILTERs.
    # Confirms the loop in ``_emit_sequence_path`` is correct beyond
    # the degenerate two-step case (a regression where the loop body
    # only ran once would have manifested as a missing third FOR or
    # a missing second join FILTER).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s :p/:q/:r ?o }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      FOR doc2 IN @@c1_Document
      FILTER doc2._uri == doc1.p
      FILTER HAS(doc2, "q")
      FOR doc3 IN @@c1_Document
      FILTER doc3._uri == doc2.q
      FILTER HAS(doc3, "r")
      RETURN { s: doc1._uri, o: doc3.r }
    expected_bind_vars:
      "@c1_Document": "Document"

  - name: sequence_terminating_in_literal_object
    # Object-side literal at the END of the path becomes an attribute
    # equality FILTER on the final intermediate — same shape the
    # visitor produces for a non-path ``?s :name "Alice"`` triple
    # (Case 2's literal-object branch). Confirms that
    # ``_emit_sequence_path`` correctly threads the user-supplied
    # ``obj`` (the literal ``"Alice"``) into the last expanded
    # triple rather than minting yet another intermediate.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :p/:q "Alice" }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      FOR doc2 IN @@c1_Document
      FILTER doc2._uri == doc1.p
      FILTER doc2.q == @_p1_q
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_q": "Alice"

  - name: sequence_terminating_in_uri_object
    # Same end-of-path shape but with a URI object — both ``Literal``
    # and ``URIRef`` rdflib terms thread through ``_emit_triple``
    # Case 2's identical branch, so the AQL is shape-identical and
    # only the bind value differs.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :p/:q <http://ex.org/alice> }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      FOR doc2 IN @@c1_Document
      FILTER doc2._uri == doc1.p
      FILTER doc2.q == @_p1_q
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_q": "http://ex.org/alice"

  # ---- InvPath ------------------------------------------------------

  - name: inverse_single_step
    # ``?s ^:p ?o`` rewrites to ``?o :p ?s`` — one swap, no
    # intermediates. The fresh FOR opens on ?o's namespace (now the
    # SPARQL "subject" after the swap), and ?s ends up as
    # ``doc1.p`` in the projection. This is the smallest possible
    # inverse path and makes the swap visible: ``s`` projects from
    # ``doc1.p`` while ``o`` projects from ``doc1._uri``.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s ^:p ?o }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      RETURN { s: doc1.p, o: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"

  - name: inverse_with_uri_subject
    # ``<alice> ^:p ?o`` rewrites to ``?o :p <alice>``. The URI ends
    # up as a literal-equality FILTER on the property, the variable
    # opens the FOR. Confirms the inverse-path rewrite correctly
    # routes URI subjects through the URIRef-object branch of
    # ``_emit_triple`` Case 2 after the swap.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?o WHERE { <http://ex.org/alice> ^:p ?o }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER doc1.p == @_p1_p
      RETURN { o: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_p": "http://ex.org/alice"

  - name: inverse_of_sequence_combined
    # The most common compound form in the W3C corpus:
    # ``?s ^(:p/:q) ?o`` — an InvPath whose ``.arg`` is a
    # SequencePath. The outer InvPath rewrites to
    # ``?o :p/:q ?s``, which then desugars to ``?o :p ?_path_1 .
    # ?_path_1 :q ?s``. Recursion through ``_emit_triple`` handles
    # both layers without the path module knowing anything about
    # the inner type.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s ^(:p/:q) ?o }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      FOR doc2 IN @@c1_Document
      FILTER doc2._uri == doc1.p
      FILTER HAS(doc2, "q")
      RETURN { s: doc2.q, o: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"

  # ---- Composition with the rest of the visitor --------------------

  # ---- MulPath (``:p?`` / ``:p+`` / ``:p*``) ------------------------
  #
  # SPARQL 1.1 §18.4 defines these as repetition of the inner path.
  # Lacking an unbounded AQL construct, the translator lowers them
  # to a ``UNION_DISTINCT`` of fixed-length path arms bounded by
  # :attr:`SchemaResolver.property_path_max_depth` (set semantics —
  # SPARQL §9: path endpoints appear once even if many walks match).
  # ``:p?`` is bounded at 1 by the modifier itself; ``:p+`` / ``:p*``
  # honour the resolver knob. The goldens below override the knob to
  # keep the AQL short and reviewable; the default in production is 10.
  # See :mod:`arango_sparql.translate.paths`.

  - name: mul_path_zero_or_one
    # ``?s :p? ?o`` — identity arm + one-hop arm. No knob needed
    # because ``?`` is bounded at 1 by the SPARQL spec. The one-hop
    # arm picks up the ``FILTER HAS(doc, "p")`` predicate-existence
    # guard the variable-object BGP emitter attaches to every
    # ``?s :p ?o`` triple; the identity arm has no triple and
    # therefore no guard.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s :p? ?o }
    expected_aql: |-
      FOR row3 IN UNION_DISTINCT(
      (
        FOR doc1 IN @@c1_Document
        RETURN { o: doc1._uri, s: doc1._uri }
      ),
      (
        FOR doc2 IN @@c2_Document
        FILTER HAS(doc2, "p")
        RETURN { o: doc2.p, s: doc2._uri }
      )
      )
      RETURN { s: row3.s, o: row3.o }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"

  - name: mul_path_one_or_more_depth_two
    # ``?s :p+ ?o`` with max_depth=2 → two arms (one-hop, two-hop).
    # Both arms gain the per-step ``FILTER HAS(doc, "p")`` guard.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s :p+ ?o }
    property_path_max_depth: 2
    expected_aql: |-
      FOR row4 IN UNION_DISTINCT(
      (
        FOR doc1 IN @@c1_Document
        FILTER HAS(doc1, "p")
        RETURN { o: doc1.p, s: doc1._uri }
      ),
      (
        FOR doc2 IN @@c2_Document
        FILTER HAS(doc2, "p")
        FOR doc3 IN @@c2_Document
        FILTER doc3._uri == doc2.p
        FILTER HAS(doc3, "p")
        RETURN { o: doc3.p, s: doc2._uri }
      )
      )
      RETURN { s: row4.s, o: row4.o }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"

  - name: mul_path_zero_or_more_depth_two
    # ``?s :p* ?o`` with max_depth=2 → three arms (identity, one-hop, two-hop).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s :p* ?o }
    property_path_max_depth: 2
    expected_aql: |-
      FOR row5 IN UNION_DISTINCT(
      (
        FOR doc1 IN @@c1_Document
        RETURN { o: doc1._uri, s: doc1._uri }
      ),
      (
        FOR doc2 IN @@c2_Document
        FILTER HAS(doc2, "p")
        RETURN { o: doc2.p, s: doc2._uri }
      ),
      (
        FOR doc3 IN @@c3_Document
        FILTER HAS(doc3, "p")
        FOR doc4 IN @@c3_Document
        FILTER doc4._uri == doc3.p
        FILTER HAS(doc4, "p")
        RETURN { o: doc4.p, s: doc3._uri }
      )
      )
      RETURN { s: row5.s, o: row5.o }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"
      "@c3_Document": "Document"

  - name: sequence_with_sibling_attribute_triple
    # A path triple and a plain attribute triple sharing a subject.
    # Confirms ``_ensure_subject_alias`` returns the already-bound
    # alias for the second triple's ``?s`` (so we don't open a third
    # FOR) and that the projection picks up the attribute (?n) from
    # the same alias the path's first step opened (doc1.name).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o ?n WHERE { ?s :p/:q ?o . ?s :name ?n }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      FOR doc2 IN @@c1_Document
      FILTER doc2._uri == doc1.p
      FILTER HAS(doc2, "q")
      FILTER HAS(doc1, "name")
      RETURN { s: doc1._uri, o: doc2.q, n: doc1.name }
    expected_bind_vars:
      "@c1_Document": "Document"

  # ---- NegatedPath (forward-only, SPARQL 1.1 §18.4) -----------------

  - name: negated_path_single_forward_iri
    # ``?s !:p ?o`` — the simplest negated path. Lowered to an
    # ATTRIBUTES fan-out so every non-system attribute on the
    # subject contributes one binding row, with ``"p"`` excluded
    # via the NOT IN guard. ``_uri`` and the resolver's
    # ``graph_field`` (default ``"_graph"``) are always excluded
    # — they're physical metadata, not RDF predicates.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s !:p ?o }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FOR k2 IN ATTRIBUTES(doc1, true)
      FILTER k2 NOT IN @_p1_neg_path_skip
      RETURN { s: doc1._uri, o: doc1[k2] }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_neg_path_skip":
        - "_graph"
        - "_uri"
        - "p"

  - name: negated_path_alternative_multi_forward
    # ``?s !(:p|:q) ?o`` — multi-arm negation, identical shape to
    # the single-arm case but with a longer NOT IN skip list. The
    # arms are sorted to keep the bind value stable across runs
    # regardless of source-order; otherwise two semantically-equal
    # queries would compare unequal at golden-diff time.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s !(:p|:q) ?o }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FOR k2 IN ATTRIBUTES(doc1, true)
      FILTER k2 NOT IN @_p1_neg_path_skip
      RETURN { s: doc1._uri, o: doc1[k2] }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_neg_path_skip":
        - "_graph"
        - "_uri"
        - "p"
        - "q"

  - name: negated_path_uri_subject_pp10_shape
    # Mirrors the W3C ``property-path/pp10.rq`` test:
    # ``in:a !(ex:p1|ex:p2) ?x``. The URIRef subject adds a single
    # ``doc1._uri == @_p1_uri`` FILTER on top of the standard
    # ATTRIBUTES fan-out; the negated set picks up the resolver's
    # local-name fallback for the unmapped predicates (``"p1"``,
    # ``"p2"``).
    sparql: |
      prefix ex: <http://www.example.org/schema#>
      prefix in: <http://www.example.org/instance#>
      SELECT ?x WHERE { in:a !(ex:p1|ex:p2) ?x }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER doc1._uri == @_p1_uri
      FOR k2 IN ATTRIBUTES(doc1, true)
      FILTER k2 NOT IN @_p2_neg_path_skip
      RETURN { x: doc1[k2] }
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_uri": "http://www.example.org/instance#a"
      "_p2_neg_path_skip":
        - "_graph"
        - "_uri"
        - "p1"
        - "p2"

# ---------------------------------------------------------------------
# Unsupported-path goldens.
#
# These cases are EXPECTED to raise ``UnsupportedSparqlError`` with a
# stable message — the test runner verifies the message substring so
# the W3C XFAIL bucket stays uniquely identifiable for the next
# coverage-report regen. Once a slice implements one of these, the
# expected_error key is removed and replaced with expected_aql.
# ---------------------------------------------------------------------

unsupported:
  # NOTE: ``mul_path_*_rejected`` entries were removed once ``:p+`` /
  # ``:p*`` / ``:p?`` shipped via the UNION-of-fixed-paths desugaring
  # in :func:`arango_sparql.translate.paths._emit_mul_path`. The
  # positive goldens above (``mul_path_zero_or_one``,
  # ``mul_path_one_or_more_depth_two``, ``mul_path_zero_or_more_depth_two``)
  # are the active coverage for those operators.

  # NOTE: ``alternative_path_rejected`` was removed once
  # AlternativePath (``:p|:q``) shipped via
  # ``arango_sparql.translate.union_paths.emit_alternative_path``;
  # see tests/translate/union_paths.yml + the byte-for-byte
  # equivalence golden in test_translate_union_paths_goldens.py
  # for active coverage.

  # NOTE: ``negated_path_rejected`` (forward-only ``!:p``) was removed
  # once NegatedPath shipped via the ATTRIBUTES + NOT IN emission in
  # :func:`arango_sparql.translate.paths._emit_negated_path`. Positive
  # goldens above (``negated_path_single_forward_iri``,
  # ``negated_path_alternative_multi_forward``,
  # ``negated_path_uri_subject_pp10_shape``) are the active coverage.

  - name: negated_path_inverse_arm_rejected
    # ``?s !(^:p) ?o`` — "any predicate that is not the *incoming*
    # ``:p``". Requires scanning every other document's outgoing
    # edges per query (a full-collection join), qualitatively
    # different from the forward attribute-iteration shape. Defer
    # to its own slice; surface a stable, greppable XFAIL message.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s !(^:p) ?o }
    expected_error_substring: "negated property paths with inverse arms"
