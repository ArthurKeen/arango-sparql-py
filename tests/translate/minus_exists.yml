# Golden corpus for SPARQL 1.1 `MINUS`, `FILTER EXISTS`, and
# `FILTER NOT EXISTS` (`arango_sparql.translate.minus_exists`),
# plus the template-less `CONSTRUCT WHERE { … }` short-form
# (synthesised template).
#
# All three first constructs share one AQL recipe: spawn a child
# builder over the inner pattern with the outer's bindings
# pre-seeded so shared variables turn into equality FILTERs, then
# probe with ``LET <p> = LENGTH((<inner LIMIT 1 RETURN 1>))`` and
# FILTER on ``<p> == 0`` (MINUS / NOT EXISTS) or ``<p> > 0``
# (EXISTS). The probe primitives are the same
# :meth:`AqlQueryBuilder.create_child` / :meth:`absorb_child` /
# :meth:`for_subquery`-family that the ``ToMultiSet`` slice
# introduced.
#
# The empty-shared-vars divergence between MINUS and NOT EXISTS
# is exercised explicitly (``minus_disjoint_vars_is_noop`` vs
# ``not_exists_disjoint_vars``) — SPARQL 1.1 §8.3.4 mandates
# MINUS short-circuits when the patterns share no variables,
# while NOT EXISTS does not. Pinning both shapes catches a future
# regression that conflates them.
#
# CONSTRUCT WHERE goldens land here too because they ship in the
# same slice — synthesising the implicit template from the BGP is
# small but covers four W3C ``mf:CONSTRUCT`` tests that previously
# XFAIL'd with ``UnsupportedSparql: CONSTRUCT without a template
# is not supported``.

ontology: ""

cases:
  # ---- MINUS --------------------------------------------------------

  - name: minus_shared_subject
    # The classic shape: outer binds ``?s`` via the BGP, the MINUS
    # right side filters out any ``?s`` that also has
    # ``:hidden true``. Translation: child-builder probe over the
    # right side, pre-seeded with the outer's ``var_to_expr``, so
    # the inner emits ``FILTER doc2._uri == doc1._uri`` as the
    # shared-variable join. ``FILTER minus_probe3 == 0`` enforces
    # the MINUS semantic (remove outer rows that matched).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :name ?n MINUS { ?s :hidden true } }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      LET minus_probe3 = LENGTH((
        FOR doc2 IN @@c2_Document
        FILTER doc2._uri == doc1._uri
        FILTER doc2.hidden == @_p1_hidden
        LIMIT 1
        RETURN 1
      ))
      FILTER minus_probe3 == 0
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"
      "_p1_hidden": true

  - name: minus_disjoint_vars_is_noop
    # SPARQL 1.1 §8.3.4 specifies MINUS as a no-op when the two
    # sides share no variables: compatibility is vacuous, so no
    # outer row is removed. Translation: no LET probe, no FILTER —
    # the outer query passes through unchanged. Critical regression
    # coverage; a sloppy implementation that always emitted the
    # probe would silently prune ALL outer rows in this case
    # (since the inner pattern matches anything ⇒ probe > 0 ⇒
    # FILTER probe == 0 fails everywhere).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s :name ?n MINUS { ?x :hidden true } }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"

  # ---- MINUS containing OPTIONAL (conditional-add) ------------------

  - name: minus_optional_single_rebind
    # SPARQL §18.2.5.2 + §8.3.4 (ADR-0002 Problem 2). The MINUS right
    # side's OPTIONAL re-binds ``?b``, which the outer side already
    # bound. The optional triple is therefore NOT a fresh binding but a
    # *conditional add* — a compatibility test against the existing
    # value. Two FILTERs encode that:
    #   1. compatibility — the optional matches iff its value is absent
    #      or equals the outer binding (null on either side is vacuously
    #      OK): ``(q1 == null || p == null || q1 == p)``.
    #   2. disjoint-domain "overlap" guard (§8.3.4) — because the ONLY
    #      shared variable (``?b``) is bound by an optional, an inner row
    #      removes an outer row only if it actually shares that bound
    #      value: ``(q1 != null && p != null && q1 == p)``. Without this
    #      guard a ``?d`` matching nothing (q1 absent) would wrongly
    #      delete every outer row.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?b WHERE { ?x :p ?b MINUS { ?d :base ?z OPTIONAL { ?d :q1 ?b } } }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      LET minus_probe3 = LENGTH((
        FOR doc2 IN @@c2_Document
        FILTER HAS(doc2, "base")
        FILTER (doc2.q1 == null || doc1.p == null || doc2.q1 == doc1.p)
        FILTER (doc2.q1 != null && doc1.p != null && doc2.q1 == doc1.p)
        LIMIT 1
        RETURN 1
      ))
      FILTER minus_probe3 == 0
      RETURN { b: doc1.p }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"

  - name: minus_optional_two_rebinds
    # The W3C ``negation/full-minuend`` shape: two OPTIONALs each
    # re-bind a distinct outer variable (``?b``, ``?c``). Each emits its
    # own compatibility FILTER; the overlap guard is the OR across both
    # (an inner row removes an outer row if it shares *either* bound
    # value). ``tests/cross/test_minus_optional_cross.py`` pins the
    # binding-level correctness of this exact shape against pyoxigraph.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?b ?c WHERE {
        ?x :p ?b ; :p2 ?c
        MINUS { ?d :base ?z OPTIONAL { ?d :q1 ?b } OPTIONAL { ?d :q2 ?c } }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "p")
      FILTER HAS(doc1, "p2")
      LET minus_probe3 = LENGTH((
        FOR doc2 IN @@c2_Document
        FILTER HAS(doc2, "base")
        FILTER (doc2.q1 == null || doc1.p == null || doc2.q1 == doc1.p)
        FILTER (doc2.q2 == null || doc1.p2 == null || doc2.q2 == doc1.p2)
        FILTER ((doc2.q1 != null && doc1.p != null && doc2.q1 == doc1.p) || (doc2.q2 != null && doc1.p2 != null && doc2.q2 == doc1.p2))
        LIMIT 1
        RETURN 1
      ))
      FILTER minus_probe3 == 0
      RETURN { b: doc1.p, c: doc1.p2 }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"

  # ---- FILTER EXISTS / NOT EXISTS -----------------------------------

  - name: exists_shared_subject
    # ``FILTER EXISTS { … }`` is structurally a sibling of MINUS —
    # same child-builder probe, same pre-seeded ``var_to_expr``,
    # same ``LIMIT 1 RETURN 1`` short-circuit. The only difference
    # is the outer comparator: ``probe > 0`` (keep outer rows
    # whose substitution does match) vs MINUS's ``probe == 0``
    # (drop outer rows whose substitution does match).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE {
        ?s :name ?n . FILTER EXISTS { ?s :hidden true }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      LET exists_probe3 = LENGTH((
        FOR doc2 IN @@c2_Document
        FILTER doc2._uri == doc1._uri
        FILTER doc2.hidden == @_p1_hidden
        LIMIT 1
        RETURN 1
      ))
      FILTER exists_probe3 > 0
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"
      "_p1_hidden": true

  - name: not_exists_shared_subject
    # ``FILTER NOT EXISTS { … }`` — the EXISTS recipe with the
    # comparator flipped to ``== 0``. Same shape as MINUS here,
    # but the divergence shows up in the disjoint-vars case
    # immediately below.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE {
        ?s :name ?n . FILTER NOT EXISTS { ?s :hidden true }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      LET not_exists_probe3 = LENGTH((
        FOR doc2 IN @@c2_Document
        FILTER doc2._uri == doc1._uri
        FILTER doc2.hidden == @_p1_hidden
        LIMIT 1
        RETURN 1
      ))
      FILTER not_exists_probe3 == 0
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"
      "_p1_hidden": true

  - name: not_exists_disjoint_vars
    # NOT EXISTS does NOT inherit MINUS's disjoint-vars short-cut
    # (SPARQL 1.1 §17.4.1.10): it asks "does the inner pattern
    # match ANY row of the dataset?", not "any row compatible
    # with the current outer binding?" — so the probe still fires
    # even without shared variables. Inner block has no FILTER
    # joining inner alias to outer expression (no shared var to
    # join on), but it still LIMITs / RETURNs / probes correctly.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE {
        ?s :name ?n . FILTER NOT EXISTS { ?z :foo ?bar }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      LET not_exists_probe3 = LENGTH((
        FOR doc2 IN @@c2_Document
        FILTER HAS(doc2, "foo")
        LIMIT 1
        RETURN 1
      ))
      FILTER not_exists_probe3 == 0
      RETURN { s: doc1._uri }
    expected_bind_vars:
      "@c1_Document": "Document"
      "@c2_Document": "Document"

  # ---- CONSTRUCT WHERE (template-less) ------------------------------

  - name: construct_where_single_triple
    # ``CONSTRUCT WHERE { ?s :name ?n }`` — SPARQL 1.1 §16.2.1
    # short-form where the WHERE BGP doubles as the output
    # template. The visitor walks the BGP, synthesises the
    # template as a list-of-triples, then drives the existing
    # ``return_triples`` path the explicit-template form already
    # uses. No new AQL shape — just template discovery.
    sparql: |
      PREFIX : <http://ex.org/>
      CONSTRUCT WHERE { ?s :name ?n }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "name")
      RETURN [{subject: doc1._uri, predicate: @_p1_uri, object: doc1.name}]
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_uri": "http://ex.org/name"

  - name: construct_where_multi_triple
    # Multi-triple BGP — the synthesised template has one entry
    # per BGP triple, in BGP iteration order (which the visitor's
    # ``_triple_priority`` sort stabilises). Output is a single
    # ``RETURN [ {…}, {…} ]`` per binding row; the route layer's
    # RDF renderer dedupes triples via ``rdflib.Graph`` set
    # semantics.
    sparql: |
      PREFIX : <http://ex.org/>
      CONSTRUCT WHERE { ?s :name ?n . ?s :age ?a }
    expected_aql: |-
      FOR doc1 IN @@c1_Document
      FILTER HAS(doc1, "age")
      FILTER HAS(doc1, "name")
      RETURN [{subject: doc1._uri, predicate: @_p1_uri, object: doc1.age}, {subject: doc1._uri, predicate: @_p2_uri, object: doc1.name}]
    expected_bind_vars:
      "@c1_Document": "Document"
      "_p1_uri": "http://ex.org/age"
      "_p2_uri": "http://ex.org/name"
