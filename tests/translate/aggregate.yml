# Golden corpus for SPARQL aggregates (rdflib's ``AggregateJoin`` over
# a ``Group``). Covers COUNT, COUNT DISTINCT, SUM/AVG/MIN/MAX (mapped to
# AQL aggregate functions), GROUP_CONCAT (mapped to AQL
# ``CONCAT_SEPARATOR``), GROUP BY, and HAVING (which is a plain FILTER
# above the AggregateJoin in the algebra).
#
# SPARQL's COUNT(expr) counts the solutions where ``expr`` has a value;
# an unbound variable is null on the AQL side, and AQL's COUNT and
# COUNT_DISTINCT both count null (issue #46). So:
#   * ``COLLECT … WITH COUNT INTO c`` (legacy
#     ``aql-query-builder.js#collect``'s idiom) only for a lone COUNT
#     whose argument is bound in every row: ``*``, or the identity of a
#     document scanned at the top level;
#   * any other COUNT → ``AGGREGATE a = SUM(expr != null ? 1 : 0)``,
#     read as ``NOT_NULL(a, 0)`` when ungrouped (SUM over no rows is null);
#   * COUNT DISTINCT → ``AGGREGATE a = UNIQUE(expr)``, read as
#     ``LENGTH(REMOVE_VALUE(a, null))``.
# Aggregate arguments read the pre-COLLECT bindings: a GROUP BY key's
# COLLECT alias is not visible inside AGGREGATE.
# Grouped forms are wrapped once so an empty input yields SPARQL's
# single empty solution instead of AQL COLLECT's zero rows.

ontology: |
  @prefix : <http://ex.org/> .
  @prefix owl: <http://www.w3.org/2002/07/owl#> .
  @prefix phys: <https://arango.solutions/phys#> .

  :Person a owl:Class ; phys:collectionName "Person" .

cases:
  - name: count_star_ungrouped
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (COUNT(*) AS ?c) WHERE { ?s a :Person }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      COLLECT WITH COUNT INTO agg2
      RETURN { c: agg2 }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: count_var_ungrouped
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (COUNT(?s) AS ?c) WHERE { ?s a :Person }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      COLLECT WITH COUNT INTO agg2
      RETURN { c: agg2 }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: count_distinct_ungrouped
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (COUNT(DISTINCT ?d) AS ?c) WHERE { ?s a :Person ; :dept ?d }
    # AQL's COUNT_DISTINCT counts null as one more value, and an unbound
    # (or stored-null) ``dept`` is null here, so the distinct values are
    # collected with UNIQUE and null is dropped where the count is read
    # (issue #46).
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "dept")
      COLLECT AGGREGATE agg2 = UNIQUE(doc1.dept)
      RETURN { c: LENGTH(REMOVE_VALUE(agg2, null)) }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: group_by_count
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (COUNT(?s) AS ?c) WHERE { ?s a :Person ; :dept ?d } GROUP BY ?d
    expected_aql: |-
      LET results4 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "dept")
        COLLECT grp2 = doc1.dept WITH COUNT INTO agg3
        RETURN { d: grp2, c: agg3 }
      )
      FOR result5 IN (LENGTH(results4) == 0 ? [{}] : results4)
      RETURN result5
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: group_by_avg_sum
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (AVG(?a) AS ?avg) (SUM(?a) AS ?tot) WHERE {
        ?s a :Person ; :dept ?d ; :age ?a
      } GROUP BY ?d
    expected_aql: |-
      LET results5 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "age")
        FILTER HAS(doc1, "dept")
        COLLECT grp2 = doc1.dept AGGREGATE agg3 = AVG(doc1.age), agg4 = SUM(doc1.age)
        RETURN { d: grp2, avg: agg3, tot: agg4 }
      )
      FOR result6 IN (LENGTH(results5) == 0 ? [{}] : results5)
      RETURN result6
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: group_by_min_max
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (MIN(?a) AS ?mn) (MAX(?a) AS ?mx) WHERE {
        ?s a :Person ; :dept ?d ; :age ?a
      } GROUP BY ?d
    expected_aql: |-
      LET results5 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "age")
        FILTER HAS(doc1, "dept")
        COLLECT grp2 = doc1.dept AGGREGATE agg3 = MIN(doc1.age), agg4 = MAX(doc1.age)
        RETURN { d: grp2, mn: agg3, mx: agg4 }
      )
      FOR result6 IN (LENGTH(results5) == 0 ? [{}] : results5)
      RETURN result6
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: group_concat_with_separator
    # SPARQL GROUP_CONCAT defaults to a single-space separator; the
    # explicit ``SEPARATOR=…`` overrides go through ``agg.separator``
    # as an rdflib Literal which we unwrap to a Python string before
    # binding. ``CONCAT_SEPARATOR`` is not a legal ``COLLECT
    # AGGREGATE`` function (runtime ERR 1574), so the group's values
    # are aggregated with ``PUSH`` and joined at projection time.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (GROUP_CONCAT(?n; SEPARATOR=", ") AS ?names) WHERE {
        ?s a :Person ; :dept ?d ; :name ?n
      } GROUP BY ?d
    expected_aql: |-
      LET results4 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "dept")
        FILTER HAS(doc1, "name")
        COLLECT grp2 = doc1.dept AGGREGATE agg3 = PUSH(doc1.name)
        RETURN { d: grp2, names: CONCAT_SEPARATOR(@_p1_sep, agg3) }
      )
      FOR result5 IN (LENGTH(results4) == 0 ? [{}] : results4)
      RETURN result5
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1_sep": ", "

  - name: group_by_having
    # HAVING is a plain ``Filter`` node in the algebra, sitting ABOVE
    # the post-aggregation Extend chain. The filter expression
    # references the synthetic ``__agg_N__`` slot, which is mapped to
    # the COLLECT alias by the time the FILTER is visited — so the
    # emitted FILTER references ``aggN`` directly.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (COUNT(?s) AS ?c) WHERE {
        ?s a :Person ; :dept ?d
      } GROUP BY ?d HAVING (COUNT(?s) > 1)
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "dept")
      COLLECT grp2 = doc1.dept AGGREGATE agg3 = COUNT(NOT_NULL(doc1._uri, doc1._id)), agg4 = COUNT(NOT_NULL(doc1._uri, doc1._id))
      FILTER (agg4 > @_p1)
      RETURN { d: grp2, c: agg3 }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": 1

  - name: group_by_count_order_by_count_desc
    # ORDER BY references the user-facing aggregate alias ``?c``, which
    # by the time visit_OrderBy runs has been remapped through the
    # Extend rename chain to the COLLECT output ``agg3``.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (COUNT(?s) AS ?c) WHERE {
        ?s a :Person ; :dept ?d
      } GROUP BY ?d ORDER BY DESC(?c)
    expected_aql: |-
      LET results4 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "dept")
        COLLECT grp2 = doc1.dept WITH COUNT INTO agg3
        SORT agg3 DESC
        RETURN { d: grp2, c: agg3 }
      )
      FOR result5 IN (LENGTH(results4) == 0 ? [{}] : results4)
      RETURN result5
    expected_bind_vars:
      "@c1_Person": "Person"

  # ---- COUNT counts bound values only (issue #46) --------------------

  - name: count_optional_var_ungrouped
    # Only some people have an email: COUNT(?e) counts those, not every
    # row the OPTIONAL keeps.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (COUNT(?e) AS ?c) WHERE { ?s a :Person OPTIONAL { ?s :email ?e } }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      COLLECT AGGREGATE agg2 = SUM(doc1.email != null ? 1 : 0)
      RETURN { c: NOT_NULL(agg2, 0) }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: count_never_bound_var
    # ``?o`` is bound nowhere in the pattern, so it is unbound in every
    # solution and the count is 0 (it used to count every row).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (COUNT(?o) AS ?c) WHERE { ?s a :Person }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      COLLECT AGGREGATE agg2 = SUM(null != null ? 1 : 0)
      RETURN { c: NOT_NULL(agg2, 0) }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: group_by_count_optional_var
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (COUNT(?e) AS ?c) WHERE {
        ?s a :Person ; :dept ?d OPTIONAL { ?s :email ?e }
      } GROUP BY ?d
    expected_aql: |-
      LET results4 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "dept")
        COLLECT grp2 = doc1.dept AGGREGATE agg3 = SUM(doc1.email != null ? 1 : 0)
        RETURN { d: grp2, c: agg3 }
      )
      FOR result5 IN (LENGTH(results4) == 0 ? [{}] : results4)
      RETURN result5
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: group_by_count_of_the_group_key
    # The argument reads ``doc1.dept``, not the key alias ``grp2``: a
    # COLLECT key is not visible inside AGGREGATE (ArangoDB ERR 1512).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (COUNT(?d) AS ?c) WHERE { ?s a :Person ; :dept ?d } GROUP BY ?d
    expected_aql: |-
      LET results4 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "dept")
        COLLECT grp2 = doc1.dept AGGREGATE agg3 = SUM(doc1.dept != null ? 1 : 0)
        RETURN { d: grp2, c: agg3 }
      )
      FOR result5 IN (LENGTH(results4) == 0 ? [{}] : results4)
      RETURN result5
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: count_optional_var_with_max
    # The generic AGGREGATE path (COUNT mixed with another aggregate).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT (COUNT(?e) AS ?c) (MAX(?a) AS ?m) WHERE {
        ?s a :Person ; :age ?a OPTIONAL { ?s :email ?e }
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "age")
      COLLECT AGGREGATE agg2 = SUM(doc1.email != null ? 1 : 0), agg3 = MAX(doc1.age)
      RETURN { c: NOT_NULL(agg2, 0), m: agg3 }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: count_distinct_optional_var_having
    # The DISTINCT count is read where HAVING tests it, with null dropped.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d WHERE {
        ?s a :Person ; :dept ?d OPTIONAL { ?s :email ?e }
      } GROUP BY ?d HAVING (COUNT(DISTINCT ?e) > 0)
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "dept")
      COLLECT grp2 = doc1.dept AGGREGATE agg3 = UNIQUE(doc1.email)
      FILTER (LENGTH(REMOVE_VALUE(agg3, null)) > @_p1)
      RETURN { d: grp2 }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": 0

  # ---- Any aggregate over a GROUP BY variable (found reviewing #47) -
  # Before, the argument read the COLLECT key alias (``MAX(grp2)``), which
  # ArangoDB rejects: ERR 1512 "use of unknown variable 'grp2' in AGGREGATE
  # expression". The pre-COLLECT expression is what each group aggregates.

  - name: group_by_max_of_the_group_key
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (MAX(?d) AS ?m) WHERE { ?s a :Person ; :dept ?d } GROUP BY ?d
    expected_aql: |-
      LET results4 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "dept")
        COLLECT grp2 = doc1.dept AGGREGATE agg3 = MAX(doc1.dept)
        RETURN { d: grp2, m: agg3 }
      )
      FOR result5 IN (LENGTH(results4) == 0 ? [{}] : results4)
      RETURN result5
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: group_by_group_concat_of_the_group_key
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?d (GROUP_CONCAT(?d) AS ?g) WHERE { ?s a :Person ; :dept ?d } GROUP BY ?d
    expected_aql: |-
      LET results4 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "dept")
        COLLECT grp2 = doc1.dept AGGREGATE agg3 = PUSH(doc1.dept)
        RETURN { d: grp2, g: CONCAT_SEPARATOR(@_p1_sep, agg3) }
      )
      FOR result5 IN (LENGTH(results4) == 0 ? [{}] : results4)
      RETURN result5
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1_sep": " "
