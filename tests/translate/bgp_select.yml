# Golden corpus for BGP + SELECT translation.
#
# Each entry is one independent SPARQL query plus the AQL/bind_vars we
# expect from the current visitor. Update goldens by hand when the
# translator's output legitimately changes — never auto-regenerate them.

ontology: |
  @prefix : <http://ex.org/> .
  @prefix owl: <http://www.w3.org/2002/07/owl#> .
  @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
  @prefix phys: <https://arango.solutions/phys#> .

  :Person a owl:Class ; phys:collectionName "Person" .
  :Order  a owl:Class ;
    phys:collectionName "Orders" ;
    phys:typeField "kind" ;
    phys:typeValue "order" .

cases:
  - name: type_pattern_only
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: type_with_unmapped_property
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n WHERE { ?s a :Person ; :name ?n }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      RETURN { s: NOT_NULL(doc1._uri, doc1._id), n: doc1.name }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: type_with_literal_filter
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name "Alice" }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER doc1.name == @_p1_name
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1_name": "Alice"

  - name: hybrid_collection_emits_type_filter
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?o WHERE { ?o a :Order }
    expected_aql: |
      FOR doc1 IN @@c1_Orders
      FILTER (doc1.kind == @_p1_kind || @_p1_kind IN doc1.kind)
      RETURN { o: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Orders": "Orders"
      "_p1_kind": "order"

  - name: distinct_with_limit
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT DISTINCT ?n WHERE { ?s a :Person ; :name ?n } LIMIT 5
    # SPARQL de-duplicates before it slices (Slice(Distinct(...))). This
    # golden used to pin ``LIMIT 5`` above ``RETURN DISTINCT``, which takes
    # five rows and then de-duplicates them (issue #39). The LIMIT now
    # slices the de-duplicated subquery.
    expected_aql: |
      LET deduped2 = (
        FOR doc1 IN @@c1_Person
        FILTER HAS(doc1, "name")
        RETURN DISTINCT { n: doc1.name }
      )
      FOR row3 IN deduped2
      LIMIT 5
      RETURN row3
    expected_bind_vars:
      "@c1_Person": "Person"

  # A type pattern on a variable that already has a value joins to it
  # (issue #51). It opened ``FOR doc IN @@Person`` with no join, so the row
  # crossed every Person: one VALUES row came back once per Person.
  - name: values_then_type_pattern
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { VALUES ?s { <http://ex.org/alice> } ?s a :Person }
    expected_aql: |
      FOR row1 IN @_p1_values
      FOR doc2 IN @@c1_Person
      FILTER NOT_NULL(doc2._uri, doc2._id) == row1.s
      RETURN { s: row1.s }
    expected_bind_vars:
      "_p1_values":
        - s: "http://ex.org/alice"
      "@c1_Person": "Person"

  - name: bind_then_type_pattern
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { BIND(<http://ex.org/alice> AS ?s) ?s a :Person }
    expected_aql: |
      FOR empty1 IN [1]
      LET bv2 = @_p1_uri
      FOR doc3 IN @@c1_Person
      FILTER NOT_NULL(doc3._uri, doc3._id) == bv2
      RETURN { s: bv2 }
    expected_bind_vars:
      "_p1_uri": "http://ex.org/alice"
      "@c1_Person": "Person"

  - name: select_star
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT * WHERE { ?s a :Person ; :name ?n }
    # SELECT * column order is implementation-defined per W3C. We use
    # the visitor's variable-binding insertion order (deterministic given
    # the BGP triple sort) rather than rdflib's Project.PV — the latter
    # is a set-iteration order that varies across Python runs. Type
    # pattern binds ?s first; the property triple binds ?n second.
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      RETURN { s: NOT_NULL(doc1._uri, doc1._id), n: doc1.name }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: integer_literal_filter
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :age 30 }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER doc1.age == @_p1_age
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1_age": 30
