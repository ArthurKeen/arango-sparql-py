# Seed corpus for the NL -> SPARQL eval harness (tests/nl2sparql/eval/runner.py).
#
# Shape mirrors tests/translate/bgp_select.yml: a shared `ontology:` Turtle
# block-literal (SchemaResolver.from_turtle must resolve it via the
# phys:collectionName idiom) plus a `cases:` list. Unlike the translate
# goldens, each case here carries a natural-language `nl` question (fed to
# NlPipeline.run()) and a gold `expected` SPARQL query (the judge's target),
# with an optional `scripted` field for what the no-network `scripted`
# provider config should return.
#
# This file is checked into VCS as trusted repo data — no credentials belong here.

ontology: |
  @prefix : <http://ex.org/> .
  @prefix owl: <http://www.w3.org/2002/07/owl#> .
  @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
  @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
  @prefix phys: <https://arango.solutions/phys#> .

  :Person a owl:Class ; phys:collectionName "Person" .
  :name a owl:DatatypeProperty ; rdfs:domain :Person ; rdfs:range xsd:string .
  :age  a owl:DatatypeProperty ; rdfs:domain :Person ; rdfs:range xsd:integer .

  # OPTIONAL-class term: a conditional datatype attribute on :Person. Not
  # every person carries one, so `OPTIONAL { ?s :email ?e }` exercises the
  # LeftJoin "unbound-when-absent" cardinality. Same phys idiom as :name/:age
  # (a bare owl:DatatypeProperty resolves to the local-name attribute
  # "email"), so it transpiles without any extra mapping.
  :email a owl:DatatypeProperty ; rdfs:domain :Person ; rdfs:range xsd:string .

  # Aggregation-per-key / multi-hop term: a Person -> Order object property
  # backed by a dedicated edge collection ("placed"), the DEDICATED_COLLECTION
  # idiom from tests/translate/edge_traversal.yml. An owl:ObjectProperty MUST
  # carry phys:edgeCollectionName or the visitor raises SchemaResolutionError
  # (PRD §6.2) — a bare object property is NOT an attribute join. This mapping
  # lets `?p :placed ?o` emit an OUTBOUND traversal so orders can be counted
  # per person and multi-triple BGPs can span the Person->Order hop.
  :placed a owl:ObjectProperty ; rdfs:domain :Person ; rdfs:range :Order ;
    phys:edgeCollectionName "placed" .

  # Property-path term: a Person -> Person social relation backed by a
  # dedicated "knows" edge collection (same edge_traversal.yml idiom as
  # :placed). Being a real graph edge makes it the textbook property-path
  # subject, so `:knows+` (transitive), `:knows*` (reflexive-transitive),
  # `^:knows` (inverse), `:knows|:placed` (alternative) and `!:knows`
  # (forward-negated) all transpile to non-empty AQL.
  :knows a owl:ObjectProperty ; rdfs:domain :Person ; rdfs:range :Person ;
    phys:edgeCollectionName "knows" .

  :Order a owl:Class ;
    phys:collectionName "Orders" ;
    phys:typeField "kind" ;
    phys:typeValue "order" .

cases:
  - name: people-with-names
    nl: "List all people along with their names."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n WHERE { ?s a :Person ; :name ?n . }

  - name: person-named-alice
    nl: "Which person is named Alice?"
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name "Alice" . }

  - name: people-aged-30
    nl: "Find the people who are 30 years old."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :age 30 . }

  - name: distinct-names-limit
    nl: "List up to 5 distinct names of people."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT DISTINCT ?n WHERE { ?s a :Person ; :name ?n . } LIMIT 5

  - name: orders-list
    nl: "Find all orders."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?o WHERE { ?o a :Order . }

  # Deliberate near-miss (RESEARCH Pitfall 5): the scripted response the
  # ScriptedLLMClient returns for this case is valid SPARQL but drops the
  # `?a`/`:age` binding the gold `expected` requires, so the canonical
  # rdflib-algebra judge fails it. This keeps the scripted config's
  # pass-rate intentionally below 1.0 so baseline.json is a meaningful,
  # non-trivial regression gate rather than a proof of nothing.
  - name: deliberate-near-miss
    nl: "Find all people along with their names and ages."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n ?a WHERE { ?s a :Person ; :name ?n ; :age ?a . }
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n WHERE { ?s a :Person ; :name ?n . }

  # =====================================================================
  # Difficulty class: OPTIONAL cardinality (rdflib LeftJoin)
  # =====================================================================
  # Same-subject OPTIONAL collapses to attribute lookups that return null
  # when the attribute is absent — SPARQL's "unbound" semantics (see
  # tests/translate/leftjoin.yml). These are POSITIVES: scripted replays the
  # gold, so they pass the canonical judge trivially; the required-vs-optional
  # contrast is what gives the class its difficulty spine.

  - name: optional-email
    nl: "List all people with their name, and their email address if one is on file."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n ?email WHERE {
        ?s a :Person ; :name ?n .
        OPTIONAL { ?s :email ?email }
      }

  - name: optional-age
    nl: "List every person and their name, including their age when it is recorded."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n ?age WHERE {
        ?s a :Person ; :name ?n .
        OPTIONAL { ?s :age ?age }
      }

  - name: optional-email-filtered
    nl: "List people and their name; also show their email, but only when it starts with the letter a."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n ?email WHERE {
        ?s a :Person ; :name ?n .
        OPTIONAL { ?s :email ?email . FILTER(STRSTARTS(?email, "a")) }
      }

  - name: required-email-contrast
    # Contrast to `optional-email`: here the email is a MANDATORY constraint
    # (it stays in the required BGP), so only people who HAVE an email match.
    # Same term, opposite cardinality — the class's required-vs-conditional axis.
    nl: "List only the people who have an email address on file, together with that email."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n ?email WHERE {
        ?s a :Person ; :name ?n ; :email ?email .
      }

  # =====================================================================
  # Difficulty class: aggregation / GROUP BY (rdflib AggregateJoin + Group)
  # =====================================================================
  # Idiomatic AQL is `COLLECT [k = e] WITH COUNT INTO c` for a single COUNT
  # and `COLLECT [k = e] AGGREGATE a = f(e)` otherwise (see
  # tests/translate/aggregate.yml). Every non-aggregated projected variable
  # appears in GROUP BY (valid SPARQL 1.1 §11.4).

  - name: count-all-people
    nl: "How many people are there in total?"
    expected: |
      PREFIX : <http://ex.org/>
      SELECT (COUNT(?s) AS ?c) WHERE { ?s a :Person }

  - name: orders-per-person
    # COUNT-per-key over the :placed relationship. ?p is the only
    # non-aggregated projected variable and is in GROUP BY.
    nl: "For each person, count how many orders they placed."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?p (COUNT(?o) AS ?c) WHERE {
        ?p a :Person ; :placed ?o .
      } GROUP BY ?p

  - name: average-age
    nl: "What is the average age across all people?"
    expected: |
      PREFIX : <http://ex.org/>
      SELECT (AVG(?a) AS ?avg) WHERE { ?s a :Person ; :age ?a }

  # =====================================================================
  # Difficulty class: property paths (SPARQL 1.1 §9 / §18.4)
  # =====================================================================
  # Every operator below is SUPPORTED by the deterministic transpiler and
  # emits non-empty AQL (see tests/translate/property_paths.yml +
  # union_paths.yml for the shipped goldens): SequencePath `/`, InvPath `^`,
  # transitive MulPath `+`/`*` (lowered to a bounded UNION of fixed-length
  # arms, default max depth 10), AlternativePath `|`, and forward NegatedPath
  # `!:p` / `!(:p|:q)`. These are POSITIVES: scripted replays the gold, so
  # they pass the canonical judge trivially. The ONLY path form the transpiler
  # rejects is the inverse-arm negated path `!(^:p)` — a Plan 03 negative, not
  # authored here.

  - name: path-friend-names-sequence
    # SequencePath `:knows/:name` — "the name of someone this person knows".
    # Desugars to a two-step join (`?s :knows ?mid . ?mid :name ?fname`).
    nl: "For each person, list the names of the people they know."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?fname WHERE { ?s a :Person ; :knows/:name ?fname . }

  - name: path-known-by-inverse
    # InvPath `^:knows` — swaps subject/object: "?s is known BY ?other".
    nl: "Find each person together with everyone who knows them."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?other WHERE { ?s ^:knows ?other }

  - name: path-reachable-transitive-plus
    # Transitive MulPath `:knows+` — one-or-more hops. Lowered to a bounded
    # UNION of fixed-length arms; the default property_path_max_depth (10)
    # applies, so no knob override is needed in the gold.
    nl: "Find everyone reachable from each person through one or more acquaintance links."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?reachable WHERE { ?s :knows+ ?reachable }

  - name: path-reachable-transitive-star
    # Reflexive-transitive MulPath `:knows*` — zero-or-more hops (adds the
    # identity arm on top of `:knows+`).
    nl: "For each person, list themselves and everyone reachable through any chain of acquaintances."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?reachable WHERE { ?s :knows* ?reachable }

  - name: path-knows-or-placed-alternative
    # AlternativePath `:knows|:placed` — desugars to a UNION of two single-
    # triple BGPs, byte-identical to the explicit UNION form.
    nl: "For each person, find everything they are linked to — whether a person they know or an order they placed."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?linked WHERE { ?s :knows|:placed ?linked }

  - name: path-not-knows-negated
    # Forward NegatedPath `!:knows` — every predicate on the subject EXCEPT
    # `:knows`. Lowered to an ATTRIBUTES fan-out with a NOT IN skip guard.
    nl: "For each person, list every related value that is not an acquaintance link."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s !:knows ?o }

  - name: path-not-knows-or-placed-negated
    # Multi-arm forward NegatedPath `!(:knows|:placed)` — same ATTRIBUTES
    # fan-out with a longer NOT IN skip list.
    nl: "For each person, list every related value that is neither an acquaintance link nor a placed order."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s !(:knows|:placed) ?o }

  # =====================================================================
  # Difficulty class: multi-hop explicit-join chain (multi-triple BGP)
  # =====================================================================
  # A multi-triple BGP spanning two hops (Person -knows-> Person -placed->
  # Order), joined on the shared intermediate ?b. Lowers to chained FOR loops
  # with an equality FILTER bridging the hops (see tests/translate/join.yml).

  - name: multihop-friends-orders
    nl: "Find the orders placed by the people that each person knows."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?a ?o WHERE {
        ?a a :Person ; :knows ?b .
        ?b :placed ?o .
      }

  - name: multihop-friend-order-with-name
    # Three-triple chain: person -> acquaintance (?b) -> order (?o), also
    # projecting the acquaintance's name. Exercises a multi-hop join where the
    # intermediate node contributes both an edge hop and an attribute.
    nl: "For each person, list the name of each acquaintance and the orders that acquaintance placed."
    expected: |
      PREFIX : <http://ex.org/>
      SELECT ?a ?bname ?o WHERE {
        ?a a :Person ; :knows ?b .
        ?b :name ?bname ; :placed ?o .
      }

  # =====================================================================
  # Difficulty class: negative / unsupported (honest refusal)
  # =====================================================================
  # These carry `expect_refusal: true` and are scored by the INVERTED judge
  # (runner._judge): a negative PASSES iff the pipeline produced NO
  # transpilable AQL (outcome.aql == ""). `expected` here is a human-readable
  # RATIONALE, NOT gold SPARQL — the CorpusCase load-time gate skips the
  # gold-parse for refusal cases (Plan 01), so it need not be valid SPARQL.
  # Each `scripted:` response is authored to trigger a GENUINE transpiler
  # rejection so the refusal is real, never a lucky miss:
  #   * neg-absent-invoice-class / neg-unexpressible-salary-relation use a
  #     deliberately MALFORMED / unparseable SPARQL string — the drift-proof
  #     PRIMARY trigger (SparqlParseError -> outcome.aql == ""), invariant to
  #     any future transpiler capability.
  #   * neg-inverse-arm-negated-path uses the ONE genuinely-unsupported
  #     property-path form, the inverse-arm negated path `!(^:knows)`
  #     (stable rejection message "negated property paths with inverse arms").
  # NB: an unknown-IRI-only query is NOT a valid refusal trigger — the
  # SchemaResolver falls back to a default collection with a WARNING, so it
  # would still transpile and the case would FALSE-pass. Likewise, supported
  # path operators (`+`/`*`/`|`/forward-`!:p`) transpile and are Plan 02
  # positives, never refusal triggers.

  - name: neg-absent-invoice-class
    # Absent-term question: the ontology models Person/Order, not invoices.
    # Drift-proof trigger — the scripted response is syntactically MALFORMED
    # (missing closing brace) so it raises SparqlParseError -> empty AQL.
    nl: "List every invoice along with its total amount."
    expect_refusal: true
    expected: |
      Unanswerable: the ontology has no :Invoice class or amount property, so the
      honest response is a refusal — not a fabricated query over invented terms.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?inv ?total WHERE { ?inv a :Invoice ; :totalAmount ?total

  - name: neg-unexpressible-salary-relation
    # The schema cannot express employment/salary/departments at all. Drift-proof
    # trigger — the scripted response is plain prose (not SPARQL), so it fails to
    # parse (SparqlParseError) and the pipeline surfaces the refusal as empty AQL.
    nl: "Which employee earns the highest salary in each department?"
    expect_refusal: true
    expected: |
      Unanswerable: the schema models people, orders and acquaintance links — not
      employment, salary or departments — so there is no honest query for this.
    scripted: |
      This question cannot be expressed as a query over the given ontology.

  - name: neg-inverse-arm-negated-path
    # Verified-unsupported construct: the inverse-arm negated path `!(^:knows)`
    # is the ONE property-path form the deterministic transpiler rejects (stable
    # message "negated property paths with inverse arms"), so it yields empty AQL.
    nl: "For each person, list everything related to them except who they are known by."
    expect_refusal: true
    expected: |
      Unsupported: the inverse-arm negated path `!(^:knows)` is explicitly rejected
      by the transpiler ("negated property paths with inverse arms"); the honest
      response is a refusal rather than silently-wrong AQL.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE { ?s !(^:knows) ?o }

  # =====================================================================
  # Refusal supplement (Plan 07.1-03, NL-BENCH-03): real UnsupportedSparqlError
  # triggers, keyed to CONFIRMED rejection sites (verified this session via
  # `arango_sparql.api.translate()` against this exact ontology, both at the
  # translate() layer and end-to-end through NlPipeline + ScriptedLLMClient —
  # every case below was empirically observed to yield `outcome.aql == ""`).
  # Unlike the drift-proof malformed-`scripted:` idiom above, each `scripted:`
  # string here is syntactically VALID SPARQL that PARSES cleanly — the
  # rejection comes from the visitor refusing the construct, not from a parse
  # failure, so these prove genuine transpiler-coverage gaps rather than a
  # SparqlParseError shortcut.
  # =====================================================================

  - name: neg-service-federation
    # Confirmed trigger: no ServiceGraphPattern visitor branch exists; the
    # generic algebra-node dispatch raises UnsupportedSparqlError (verified
    # message: "SPARQL Algebra node 'ServiceGraphPattern' is not implemented
    # yet"). Federated SPARQL SERVICE is explicitly out of scope (PROJECT.md
    # "Out of Scope" — SERVICE deferred to a possible v2).
    nl: "For each person, look up their name from the external federated SPARQL endpoint at example.org."
    expect_refusal: true
    expected: |
      Unsupported: SPARQL federated query (SERVICE) has no visitor branch in
      this transpiler and is explicitly out of scope for v1 (federation is
      deferred); the honest response is a refusal rather than silently
      ignoring the federated clause.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?remote WHERE {
        ?s a :Person .
        SERVICE <http://example.org/sparql> { ?s :name ?remote }
      }

  - name: neg-offset-without-limit
    # Confirmed trigger: SPARQL grammar allows OFFSET without a paired LIMIT,
    # but the visitor explicitly rejects it (verified message: "SPARQL OFFSET
    # without LIMIT is not yet supported") rather than silently emit an
    # unbounded skip.
    nl: "Skip the first five people in the list and show me the rest, with no limit on how many."
    expect_refusal: true
    expected: |
      Unsupported: SPARQL OFFSET without a paired LIMIT is not yet supported
      by the transpiler ("SPARQL OFFSET without LIMIT is not yet supported");
      the honest response is a refusal rather than dropping the OFFSET
      silently or guessing at an implicit LIMIT.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person } OFFSET 5

  - name: neg-optional-nonvariable-object
    # Confirmed trigger: `OPTIONAL { ?o :name "Alice" }` binds a constant
    # (non-variable) object inside an OPTIONAL block — an existence test, not
    # a binding. Verified message: "OPTIONAL with a non-variable object is
    # not yet supported".
    nl: "For each person, list who they know, and note separately whether that acquaintance is specifically named Alice."
    expect_refusal: true
    expected: |
      Unsupported: an OPTIONAL block whose object is a constant literal
      ("OPTIONAL with a non-variable object is not yet supported") is an
      existence test the transpiler explicitly refuses rather than
      reinterpret as a FILTER.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?o WHERE {
        ?s a :Person ; :knows ?o .
        OPTIONAL { ?o :name "Alice" }
      }

  - name: neg-optional-variable-predicate
    # Confirmed trigger: `OPTIONAL { ?s ?p ?v }` uses a variable predicate
    # inside an OPTIONAL block. Verified message: "OPTIONAL with a variable
    # predicate is not supported".
    nl: "List each person together with every property and value on file for them, if any are recorded."
    expect_refusal: true
    expected: |
      Unsupported: a variable predicate inside an OPTIONAL block
      ("OPTIONAL with a variable predicate is not supported") is explicitly
      rejected by the transpiler rather than emit an ATTRIBUTES fan-out
      inside a LEFT JOIN.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?p ?v WHERE {
        ?s a :Person .
        OPTIONAL { ?s ?p ?v }
      }

  - name: neg-avg-distinct-aggregate
    # Confirmed trigger: DISTINCT is only supported on COUNT aggregates in
    # this transpiler; AVG(DISTINCT ...) is explicitly rejected. Verified
    # message: "DISTINCT is only supported on COUNT aggregates; got DISTINCT
    # inside 'Aggregate_Avg'".
    nl: "What is the average of each person's distinct ages?"
    expect_refusal: true
    expected: |
      Unsupported: DISTINCT is only supported on COUNT aggregates in this
      transpiler ("DISTINCT is only supported on COUNT aggregates; got
      DISTINCT inside 'Aggregate_Avg'"); AVG(DISTINCT ...) is explicitly
      rejected rather than silently averaged over an implicit distinct set.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT (AVG(DISTINCT ?a) AS ?avg) WHERE { ?s a :Person ; :age ?a }

  - name: neg-optional-union-body
    # Confirmed trigger: an OPTIONAL block whose body is a UNION (not a plain
    # BGP) is deferred pending a corpus need. Verified message: "OPTIONAL
    # whose body is 'Union' (not a plain BGP) is not yet supported".
    nl: "List each person's name, or their email as a fallback if the name is not known."
    expect_refusal: true
    expected: |
      Unsupported: an OPTIONAL block whose body is a UNION rather than a
      plain BGP ("OPTIONAL whose body is 'Union' (not a plain BGP) is not
      yet supported") is deferred; the honest response is a refusal rather
      than guessing at nested-OPTIONAL/UNION semantics.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?s ?n WHERE {
        ?s a :Person .
        OPTIONAL { { ?s :name ?n } UNION { ?s :email ?n } }
      }

  # =====================================================================
  # Absent-schema-term refusals (Task 2): domain-flavored questions genuinely
  # outside the Person/Order/knows/placed schema, using the drift-proof
  # malformed/unparseable `scripted:` idiom (SparqlParseError -> outcome.aql
  # == "") so they stay invariant to any future transpiler capability, same
  # convention as neg-absent-invoice-class / neg-unexpressible-salary-relation.
  # =====================================================================

  - name: neg-absent-weather-forecast
    # Absent-term question: no :Weather class or :forecast property exists.
    # Drift-proof trigger — the scripted response is syntactically MALFORMED
    # (missing closing brace) so it raises SparqlParseError -> empty AQL.
    nl: "What is the weather forecast for tomorrow?"
    expect_refusal: true
    expected: |
      Unanswerable: the ontology models people and orders, not weather or
      forecasts, so the honest response is a refusal — not a fabricated
      query over invented terms.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?forecast WHERE { ?w a :Weather ; :forecast ?forecast

  - name: neg-absent-shipping-carrier
    # Absent-term question: orders carry no carrier/logistics data. Drift-proof
    # trigger — the scripted response is plain prose (not SPARQL), so it fails
    # to parse (SparqlParseError) and the pipeline surfaces the refusal as
    # empty AQL.
    nl: "Which shipping carrier delivered each order?"
    expect_refusal: true
    expected: |
      Unanswerable: the schema models orders without any carrier or delivery
      data — there is no :ShippingCarrier class or delivery property, so
      there is no honest query for this.
    scripted: |
      This question cannot be expressed as a query over the given ontology;
      no carrier or delivery data is modeled.

  - name: neg-absent-inventory-warehouse
    # Absent-term question: no product/warehouse/inventory terms exist.
    # Drift-proof trigger — the scripted response is syntactically MALFORMED
    # (missing closing brace) so it raises SparqlParseError -> empty AQL.
    nl: "How many units of each product are currently in stock at each warehouse?"
    expect_refusal: true
    expected: |
      Unanswerable: the schema models people, orders and acquaintance links —
      not products, warehouses or stock levels — so there is no honest query
      for this.
    scripted: |
      PREFIX : <http://ex.org/>
      SELECT ?p ?w ?qty WHERE { ?p a :Product ; :stockAt ?w ; :quantity ?qty
