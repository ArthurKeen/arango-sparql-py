cases:
- name: qald9plus-train-1
  nl: List all boardgames by GMT.
  expected: 'PREFIX dbo: <http://dbpedia.org/ontology/> PREFIX res: <http://dbpedia.org/resource/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> SELECT ?uri WHERE { ?uri
    dbo:publisher res:GMT_Games }'
- name: qald9plus-train-2
  nl: Who developed Skype?
  expected: 'PREFIX dbo: <http://dbpedia.org/ontology/> PREFIX res: <http://dbpedia.org/resource/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> SELECT DISTINCT ?uri WHERE
    { res:Skype dbo:developer ?uri. }'
- name: qald9plus-train-3
  nl: Which people were born in Heraklion?
  expected: 'PREFIX yago: <http://dbpedia.org/class/yago/> PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> PREFIX onto: <http://dbpedia.org/ontology/>
    SELECT DISTINCT ?uri WHERE { ?uri rdf:type onto:Person ; onto:birthPlace <http://dbpedia.org/resource/Heraklion>.
    }'
- name: qald9plus-train-4
  nl: In which U.S. state is Area 51 located?
  expected: 'PREFIX dbo: <http://dbpedia.org/ontology/> PREFIX res: <http://dbpedia.org/resource/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> SELECT DISTINCT ?uri WHERE
    { res:Area_51 dbo:location ?uri . ?uri dbo:country res:United_States. }'
- name: qald9plus-train-5
  nl: Who is the mayor of New York City?
  expected: 'PREFIX dbo: <http://dbpedia.org/ontology/> PREFIX res: <http://dbpedia.org/resource/>
    SELECT DISTINCT ?uri WHERE { res:New_York_City dbo:leaderName ?uri }'
- name: qald9plus-train-6
  nl: Which countries have places with more than two caves?
  expected: 'PREFIX dbo: <http://dbpedia.org/ontology/> PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    SELECT DISTINCT ?uri WHERE { ?cave rdf:type dbo:Cave ; dbo:location ?uri . ?uri
    rdf:type dbo:Country } GROUP BY ?uri HAVING ( COUNT(?cave) > 2 )'
- name: qald9plus-train-7
  nl: Where did Abraham Lincoln die?
  expected: 'PREFIX dbo: <http://dbpedia.org/ontology/> PREFIX res: <http://dbpedia.org/resource/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> SELECT DISTINCT ?uri WHERE
    { res:Abraham_Lincoln dbo:deathPlace ?uri. }'
- name: qald9plus-train-8
  nl: Which airports does Air China serve?
  expected: 'PREFIX dbo: <http://dbpedia.org/ontology/> PREFIX res: <http://dbpedia.org/resource/>
    SELECT DISTINCT ?uri WHERE { res:Air_China dbo:targetAirport ?uri }'
- name: qald9plus-train-9
