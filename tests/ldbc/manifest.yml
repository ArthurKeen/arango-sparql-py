# LDBC SNB Interactive v1 reads: how each one is run and compared.
# See docs/architecture/ldbc_benchmark_plan.md §5 and tests/ldbc/compare.py.
#
# Files are found by name: queries/interactive_v1/<op>.rq (verbatim, never
# edited) and queries/variants/<op>.<variant>.rq (labelled adaptations; the
# header of each says what changed and why).
#
#   ordering        total: compare row by row (the ORDER BY ends on a unique id)
#                   keys:  compare order_keys in sequence, rows as a multiset
#                   none:  compare multisets (no top-level ORDER BY)
#   concat_columns  GROUP_CONCAT outputs, compared as sets of their parts
#   out_of_subset   why the verbatim text cannot run as standard SPARQL 1.1
#   grouped         the top level is a GROUP BY: over no input the W3C suite
#                   (agg-empty-group) gives one empty row, pyoxigraph none;
#                   the comparator treats the two as equal

interactive-short-1: {ordering: none}
interactive-short-2: {ordering: total}
interactive-short-3: {ordering: total}
interactive-short-4: {ordering: none}
interactive-short-5: {ordering: none}
interactive-short-6: {ordering: none}
interactive-short-7: {ordering: total}

interactive-complex-1:
  grouped: true
  ordering: none
  concat_columns: [emails, lngs, studyAt, workAt]
  variants: [standard-paths]
  out_of_subset: GraphDB path search (SERVICE <http://www.ontotext.com/path#search>)
interactive-complex-2: {ordering: total}
interactive-complex-3:
  ordering: total
  variants: [no-alias-reuse]
  out_of_subset: reuses a SELECT alias in the same SELECT, which SPARQL 1.1 does not allow
interactive-complex-4: {ordering: total}
interactive-complex-5:
  grouped: true
  ordering: keys
  order_keys: [count]
interactive-complex-6:
  grouped: true
  ordering: total
  variants: [standard-paths]
  out_of_subset: GraphDB path search (SERVICE <http://www.ontotext.com/path#search>)
interactive-complex-7:
  ordering: total
  variants: [standard-datetime]
  out_of_subset: Ontotext function ofn:minutesBetween
interactive-complex-8: {ordering: total}
interactive-complex-9: {ordering: none}
interactive-complex-10: {ordering: total, grouped: true}
interactive-complex-11:
  ordering: total
  variants: [standard-paths]
  out_of_subset: GraphDB path search (SERVICE <http://www.ontotext.com/path#search>)
interactive-complex-12:
  grouped: true
  ordering: total
  concat_columns: [tagnames]
interactive-complex-13:
  ordering: none
  out_of_subset: GraphDB path search, unbounded shortest path (no SPARQL 1.1 equivalent)
interactive-complex-14:
  grouped: true
  ordering: keys
  order_keys: [pathWeight]
  concat_columns: [path]
  out_of_subset: GraphDB path search, unbounded weighted shortest paths (no SPARQL 1.1 equivalent)
